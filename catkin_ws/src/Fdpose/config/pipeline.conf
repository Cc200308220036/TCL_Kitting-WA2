# 读取代码/运行入口：bash scripts/manage_services_bash.sh [--config /路径/pipeline.conf] start|stop|status。
# 本文件只控制进程部署；实际服务代码由下面的 *_SCRIPT 变量指定。
# 各服务的推理参数仍由各自配置文件负责，例如 FDPose 的 config/fdpose_server_v2.yaml。
# 纯 Bash 启停配置：scripts/manage_services_bash.sh 默认读取本文件。
# 与 fdpose_pipeline.yaml（Client 连接）、fdpose_services.yaml（Python 启停）独立。
# 优先级：执行前传入的环境变量 > 本文件 > Bash 内置默认值。
# 格式为 Bash 变量赋值，等号两侧不能有空格，路径建议加双引号。
# 只写可信的赋值语句；加载使用 source，会执行文件中的 Shell 代码。

# ==================== 1. 容器与项目目录 ====================
# 留空：直接在当前 Linux/容器环境运行；否则填写已经启动的 Docker 容器名或 ID。
CONTAINER=""

# 以下路径均是运行服务的目标环境路径，不是宿主机挂载前的路径。
# 不指定 FDPOSE_DIR：容器内直接运行时，以 manage_services_bash.sh 的上一级为根目录，
# 不受终端当前工作目录影响。指定 CONTAINER 时必须取消注释并填容器内绝对路径。
# FDPOSE_DIR="/root/catkin_ws/src/Fdpose"

# 不指定这些路径时，保持原来的派生规则；不是以本 .conf 所在目录为基准。
# YOLO_DIR：默认 <FDPOSE_DIR>/../naviai_yolo_0909，按实际 YOLO 项目名称修改。
# YOLO_DIR="/root/catkin_ws/src/naviai_yolo"
# DEPTH_DIR：默认 <FDPOSE_DIR>/../../lingbot-depth-rqh，不启用 depth 时无需准备。
# 注意：若项目位于 <catkin_ws>/src/lingbot-depth-rqh（与 Fdpose 同级），需显式指定为下面这行。
DEPTH_DIR="/root/catkin_ws/src/lingbot-depth-rqh"
# DEPTH_DIR="/root/catkin_ws/lingbot-depth-rqh"
# RUNTIME_DIR：默认 <FDPOSE_DIR>/runtime；更换容器/目录前先停止旧部署。
# 仅用于启停日志与 PID，不改变 Service 的图片保存配置。需宿主机查看时提前挂载。
# RUNTIME_DIR="/root/catkin_ws/src/Fdpose/runtime"

# ==================== 2. Service 入口 ====================
# 可以是绝对路径；以下相对路径分别基于 FDPOSE_DIR / YOLO_DIR / DEPTH_DIR。
FDPOSE_SCRIPT="scripts/pose_estimator_track_node_roi_v2.py"
YOLO_SCRIPT="scripts/seg_service/seg_service_server.py"
# 深度补全入口需支持 --service-name 和 --camera-info-topic 参数。
DEPTH_SCRIPT="inference_depth_refine_service_v1.py"

# ==================== 3. Conda / Python ====================
# 各服务独立激活对应 Conda 环境，均在同一容器内运行。可填环境名或环境绝对路径。
# 显式设为 "" 表示跳过该服务的 Conda 激活，直接使用下面的 PYTHON_BIN。
FDPOSE_ENV="fdpose"
YOLO_ENV="seg"
DEPTH_ENV="fdpose"
# Conda 初始化脚本，不是 conda 可执行文件；使用 Conda 的服务必须能读取它。
CONDA_SH="/opt/conda/etc/profile.d/conda.sh"
# 默认使用各自激活后的 python；若填写解释器绝对路径，会作用于本次启动的所有服务。
PYTHON_BIN="python"

# ==================== 4. ROS 与动态库 ====================
# 顺序：Conda 激活 → ROS_SETUP → WS_SETUP → EXTRA_SETUP。setup 路径建议用绝对路径。
# ROS 发行版环境脚本；显式填 "" 可跳过，不会自动启动 roscore。
ROS_SETUP="/opt/ros/noetic/setup.bash"
# 默认 <FDPOSE_DIR>/../../devel/setup.bash，假设项目在 <catkin_ws>/src/Fdpose。
# 不同布局请取消注释并修改；显式 WS_SETUP="" 表示跳过。
# WS_SETUP="/root/catkin_ws/devel/setup.bash"
# 可选的额外环境脚本，可在其中动态追加库路径或设置网络；空字符串表示跳过。
EXTRA_SETUP=""
# 多个库目录用冒号分隔，追加到已有 LD_LIBRARY_PATH 前端；为空则不追加。
# Orin 示例：/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu
EXTRA_LIBRARY_PATH=""

# 默认继承目标环境中的 ROS 网络配置，不写死 IP；有需要再取消注释，填写实际地址。
ROS_IP="192.168.217.100"
ROS_HOSTNAME="192.168.217.100"
ROS_MASTER_URI="http://192.168.217.1:11311"

# ==================== 5. ROS 名称与深度补全开关 ====================
# 这些是 ROS 通信名称，不是启停命令中的固定管理名称 yolo / depth / fdpose。
# 修改后 Client 的连接名称也要同步修改，不会自动更新 Client YAML。
# YOLO 通过 ROS remap 设置；FDPose 通过 ~pose_service_name / ~mesh_service_name 设置。
YOLO_SERVICE="/instance_segmentation_service"
FDPOSE_POSE_SERVICE="/fdpose_v2/pose_estimation"
FDPOSE_MESH_SERVICE="/fdpose_v2/load_mesh"
# 深度模块的服务名称，以及获取相机内参的 CameraInfo 话题（不是 RGB/Depth 话题）。
DEPTH_SERVICE="/lingbot/depth_refine"
CAMERA_INFO="/zj_humanoid/sensor/realsense_head/color/camera_info"
# 0：start all 不启动深度补全；1：按 YOLO → depth → FDPose 顺序提交启动。
# 显式 start depth 不受开关限制；stop all 始终检查三个服务已有的 PID。
ENABLE_DEPTH_REFINE=1
